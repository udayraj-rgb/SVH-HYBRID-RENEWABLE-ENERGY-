server.port=8080

# Spring Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/tejas_grid_db
spring.datasource.username=tejas_admin
spring.datasource.password=tejas_secure_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# External FastAPI Microservice URL
fastapi.service.url=http://localhost:8000

# WhatsApp Gateway & Twilio Configuration
whatsapp.gateway.url=http://localhost:5001
twilio.account.sid=${TWILIO_ACCOUNT_SID:AC_MOCK_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN:mock_token}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# Logging
logging.level.com.tejas=INFO
logging.level.org.springframework.web=INFO

# Multi-Campus Telemetry Simulation Engine (Demo Mode)
app.simulation.enabled=true
app.simulation.interval-ms=60000

